<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinau Prototipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palet dari slide "Rancangan UI: sistem desain" */
  --primary:#4338CA; --primary-600:#382EB0; --primary-50:#EEEDFB; --primary-100:#E2E0F8;
  --reward:#F2A20C; --reward-50:#FDF1D9; --reward-ink:#835500; --reward-dark:#B87503;
  --ink:#171A2B; --ink-2:#4A5068; --ink-3:#7C8197;
  --bg:#FFFEFA; --bg-2:#F5F4EF; --line:#E6E4DC; --line-2:#EFEDE6;
  --ok:#1F9D6B; --ok-50:#DFF3EA; --ok-ink:#126B49;
  --err:#C2372B; --err-50:#FBE4E1;
  --r:16px;
  --fh:'Rubik',system-ui,sans-serif; --fb:'Nunito Sans',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
  --stage:#12141F; --panel:#1B1E30; --panel-line:#2A2E47; --panel-ink:#ECEBF6; --panel-mute:#9EA2BC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}
[hidden]{display:none!important}

/* ---------- Stage (area presentasi) ---------- */
.stage{height:100vh;display:grid;grid-template-columns:290px 1fr 310px;gap:28px;padding:20px 28px;
  background:radial-gradient(900px 600px at 50% 40%,rgba(67,56,202,.28),transparent 70%),
  radial-gradient(500px 400px at 85% 90%,rgba(242,162,12,.08),transparent 70%),var(--stage)}
.side{overflow-y:auto;color:var(--panel-ink);display:flex;flex-direction:column;gap:14px;padding:4px 2px 20px;scrollbar-width:thin;scrollbar-color:#2A2E47 transparent}
.center{display:flex;align-items:center;justify-content:center;min-width:0}
.pbrand{display:flex;align-items:center;gap:12px;padding:6px 0 4px}
.pbrand h1{font:700 22px var(--fh);letter-spacing:-.01em}
.pbrand p{font-size:12.5px;color:var(--panel-mute)}
.pcard{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:16px}
.pcard h3{font:600 11.5px var(--fh);letter-spacing:.09em;text-transform:uppercase;color:var(--reward);margin-bottom:12px}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#22263B;margin-bottom:8px}
.acct:last-child{margin-bottom:0}
.acct .meta{flex:1;min-width:0}
.acct b{font:600 13.5px var(--fh);display:block}
.acct code{font:12px var(--fm);color:var(--panel-mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{font:600 12.5px var(--fh);padding:7px 11px;border-radius:9px;background:var(--primary);color:#fff;white-space:nowrap}
.pbtn:hover{background:#5146DD}
.pbtn.ghost{background:transparent;border:1px solid var(--panel-line);color:var(--panel-ink)}
.jump{display:flex;flex-direction:column;gap:2px}
.jump button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;font-size:13.5px;color:#D5D4E6}
.jump button:hover{background:#23273E}
.jump button.on{background:rgba(67,56,202,.35);color:#fff}
.jump .n{font:600 11px var(--fm);color:var(--panel-mute);width:18px}
.simrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#22263B;padding:4px;border-radius:11px}
.simrow button{font:600 12px var(--fh);padding:7px 4px;border-radius:8px;color:var(--panel-mute)}
.simrow button.on{background:var(--panel-ink);color:var(--ink)}
.phint{font-size:12px;color:var(--panel-mute);margin-top:10px;line-height:1.5}
.note-title{font:600 18px var(--fh);margin-bottom:4px}
.note-role{display:inline-flex;font:600 11px var(--fh);padding:3px 8px;border-radius:99px;background:rgba(242,162,12,.16);color:var(--reward);margin-bottom:10px}
.note-desc{font-size:13.5px;line-height:1.6;color:#CFCEE0}
.note-sec{font:600 11px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--panel-mute);margin:14px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px var(--fm);padding:4px 8px;border-radius:7px;background:#23273E;color:#D9D8EA}
.tag.y{background:rgba(67,56,202,.3);color:#D8D5FF;font-family:var(--fb);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw div{aspect-ratio:1;border-radius:9px;border:1px solid rgba(255,255,255,.08)}
.sw-l{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:5px;font:10px var(--fm);color:var(--panel-mute);text-align:center}

/* ---------- Phone ---------- */
.phone{position:absolute;left:0;top:0;transform-origin:0 0;width:402px;height:874px;border-radius:60px;background:#07080F;padding:11px;
  box-shadow:0 0 0 1.5px #2C3047,0 40px 80px -20px rgba(0,0,0,.7),0 0 120px rgba(67,56,202,.25)}
.phone::before{content:"";position:absolute;right:-3px;top:180px;width:3px;height:90px;border-radius:2px;background:#2C3047}
.wrap{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:35px;border-radius:20px;background:#07080F;z-index:60}
.sbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 14.5px var(--fh);z-index:5;position:relative}
.sbar .r{display:flex;gap:6px;align-items:center}
.wrap.dk .sbar{color:#fff}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:5px;background:var(--ink);opacity:.85;z-index:70;pointer-events:none}
.wrap.dk .homebar{background:#fff}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 28px}
.ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ov>*{pointer-events:auto}

/* ---------- Typography ---------- */
.h1{font:700 26px/1.15 var(--fh);letter-spacing:-.015em}
.h2{font:600 20px/1.2 var(--fh);letter-spacing:-.01em}
.h3{font:600 16px/1.3 var(--fh)}
.muted{color:var(--ink-2)}
.small{font-size:13px}.xs{font-size:12px}
.mono{font-family:var(--fm)}
.eyebrow{font:600 11.5px var(--fh);letter-spacing:.09em;text-transform:uppercase}

/* ---------- Components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:var(--r);font:600 15.5px var(--fh);transition:transform .08s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.pri{background:var(--primary);color:#fff;box-shadow:0 4px 0 #2E2591}
.btn.pri:hover{background:var(--primary-600)}
.btn.pri:disabled{background:#D9D7E6;color:#8C8AA0;box-shadow:0 4px 0 #C6C3D6;cursor:not-allowed}
.btn.sec{border:1.5px solid var(--primary);color:var(--primary);background:var(--bg)}
.btn.ghost{color:var(--primary)}
.btn.danger{background:var(--err);color:#fff;box-shadow:0 4px 0 #8E241B}
.btn.danger-o{border:1.5px solid #E7B5AF;color:var(--err);background:var(--bg)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #136A47}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px;box-shadow:none}
.btn.rew{background:var(--reward);color:var(--ink);box-shadow:0 4px 0 #B37606}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.ibtn:hover{background:var(--bg-2)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
.spin.dk{border-color:var(--primary-100);border-top-color:var(--primary)}
@keyframes sp{to{transform:rotate(360deg)}}

.fld{display:block;margin-bottom:14px}
.lbl{display:flex;justify-content:space-between;font:600 13.5px var(--fh);margin-bottom:6px;color:var(--ink)}
.lbl .cnt{font:400 12px var(--fb);color:var(--ink-3)}
.inp{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink-3);transition:border .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-50);color:var(--primary)}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15.5px;color:var(--ink);height:100%}
.inp select{appearance:none;cursor:pointer}
.inp.ta{height:auto;padding:12px 14px;align-items:flex-start}
.inp textarea{flex:1;border:0;outline:0;background:transparent;font-size:15px;resize:none;min-height:84px;color:var(--ink);line-height:1.5}
.fld.bad .inp{border-color:var(--err);color:var(--err)}
.fld.bad .inp:focus-within{box-shadow:0 0 0 4px var(--err-50)}
.ferr{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--err);margin-top:6px;min-height:0}
.ferr:empty{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;font:600 13.5px var(--fh);background:var(--primary-50);color:var(--primary);white-space:nowrap;transition:background .15s}
.chip.on{background:var(--primary);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--fh);padding:3px 8px;border-radius:99px}
.pill.ok{background:var(--ok-50);color:var(--ok-ink)}
.pill.rew{background:var(--reward-50);color:var(--reward-ink)}
.pill.pri{background:var(--primary-50);color:var(--primary)}
.pill.mute{background:var(--bg-2);color:var(--ink-2)}
.pill.err{background:var(--err-50);color:var(--err)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:4px;gap:4px}
.seg button{height:38px;border-radius:10px;font:600 14px var(--fh);color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(23,26,43,.12)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;margin-bottom:14px;line-height:1.4}
.banner.err{background:var(--err-50);color:#9A2A20}
.banner.info{background:var(--primary-50);color:#2F2793}
.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 14px var(--fh);color:#fff;flex:none}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;margin:18px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.link{color:var(--primary);font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.stack>*+*{margin-top:12px}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 20px 12px}
.hdr .t{flex:1;min-width:0}
.hdr .t .h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{margin-left:-10px}
.stat{display:inline-flex;align-items:center;gap:5px;font:600 14.5px var(--fh);padding:6px 10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .ic{width:17px;height:17px}

/* bottom nav */
.nav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:rgba(255,254,250,.96);padding:8px 6px 26px;position:relative;z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--fh);color:var(--ink-3);padding:6px 0;border-radius:12px;position:relative}
.nav button .ic{width:23px;height:23px}
.nav button.on{color:var(--primary)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.nav .dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--reward);color:var(--ink);font:700 10px/16px var(--fh)}

/* overlay: toast, dialog, sheet */
.toast{position:absolute;left:14px;right:14px;top:56px;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 12px 30px rgba(23,26,43,.3);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast .ti{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.toast.ok .ti{background:var(--ok)}.toast.err .ti{background:var(--err)}.toast.info .ti{background:var(--primary)}.toast.rew .ti{background:var(--reward);color:var(--ink)}
.toast b{font-family:var(--fh);font-weight:600;display:block}
.toast .act{margin-left:auto;font:600 13.5px var(--fh);color:var(--reward);padding:6px 4px}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
.scrim{position:absolute;inset:0;background:rgba(23,26,43,.48);animation:fade .2s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--bg);border-radius:24px;padding:24px 20px 18px;text-align:center;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.92)}}
.dialog .di{width:56px;height:56px;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.dialog p{font-size:14.5px;color:var(--ink-2);margin:6px 0 20px;line-height:1.5}
.dialog .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .scroll{padding:8px 20px 34px}

/* skeleton / empty / error */
.sk{background:linear-gradient(90deg,#EEECE5 0%,#F8F7F2 50%,#EEECE5 100%);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px}
.state .art{width:96px;height:96px;border-radius:30px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.state p{font-size:14.5px;color:var(--ink-2);margin:6px 0 18px;line-height:1.5;max-width:270px}

/* ---------- Screen specific ---------- */
/* splash */
.splash{flex:1;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#fff;position:relative;overflow:hidden}
.splash .dots{display:grid;grid-template-columns:repeat(2,64px);gap:12px 18px}
.splash .dots div{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pin .5s cubic-bezier(.2,.9,.3,1.4) both}
.splash .dots div:nth-child(2){margin-top:34px;animation-delay:.12s}
.splash .dots div:nth-child(3){animation-delay:.24s}
.splash .dots div:nth-child(4){margin-top:34px;animation-delay:.36s}
@keyframes pin{from{opacity:0;transform:scale(.4)}}
.splash h1{font:700 52px var(--fh);letter-spacing:-.02em;animation:enter .5s .45s both}
.splash p{color:#A9ABC4;font-size:14px;margin-top:-18px;animation:enter .5s .55s both}

/* auth */
.auth-hero{background:var(--primary);color:#fff;padding:4px 24px 56px;position:relative;overflow:hidden;margin-top:-52px;padding-top:68px}
.auth-hero .net{position:absolute;right:-20px;top:30px;opacity:.95}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.auth-hero h1{font:700 40px var(--fh);letter-spacing:-.02em;margin-top:22px}
.auth-hero p{opacity:.85;font-size:15px;margin-top:2px}
.auth-body{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:26px 22px 30px}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.pw-meter i{height:4px;border-radius:4px;background:var(--line)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1.5px dashed var(--line);border-radius:14px;background:#fff}
.demo button:hover{border-color:var(--primary);background:var(--primary-50)}
.demo b{font:600 13.5px var(--fh);display:block}
.demo span{font-size:11.5px;color:var(--ink-3)}

/* home */
.goal{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.goal::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(242,162,12,.12)}
.goal .t b{font:600 15.5px var(--fh);display:block}
.goal .t span{font-size:13px;color:#B9BBD2}
.cont{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:#fff;border:1px solid var(--line);margin-bottom:22px}
.cont .th{width:52px;height:52px;border-radius:16px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.unit{border-radius:16px;padding:11px 14px;color:#fff;background:var(--primary);position:relative;overflow:hidden}
.unit.done{background:var(--ink)}
.unit.lock{background:#DCDAD2;color:#6E7286}
.unit .eyebrow{opacity:.8}
.unit .ttl{font:600 16.5px var(--fh);margin:1px 0 7px}
.unit .bar{height:5px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--reward);border-radius:6px}
.unit .pg{font-size:11.5px;opacity:.85;margin-top:5px;display:flex;justify-content:space-between;align-items:center}
button.unit.tap{display:block;width:100%;text-align:left;border:0;cursor:pointer;margin-bottom:10px;font:inherit;transition:transform .1s,box-shadow .15s;box-shadow:0 3px 0 rgba(0,0,0,.18)}
button.unit.tap:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.unit .go{display:inline-flex;align-items:center;gap:2px;font-weight:700;opacity:1}
.unit .go .ic{width:15px;height:15px}
.sec-h{font:600 13px var(--fh);color:var(--ink-2);margin:16px 2px 8px;letter-spacing:.02em}
.lvlist{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px}
.lvrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border:0;background:none;text-align:left;cursor:pointer;border-radius:12px;font:inherit;color:inherit}
.lvrow+.lvrow{border-top:1px solid var(--line);border-radius:0}
.lvrow:active{background:var(--bg-2)}
.lvrow .num{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 14px var(--fh)}
.lvrow.done .num{background:var(--reward);color:var(--ink)}
.lvrow.act .num{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-100)}
.lvrow.lock .num{background:#E5E3DB;color:#9A9CAC}
.lvrow .tx{flex:1;min-width:0}
.lvrow .tx b{display:block;font:600 14px var(--fh)}
.lvrow .tx span{font-size:12px;color:var(--ink-2)}
.lvrow.lock .tx b{color:var(--ink-3)}
.unit svg.deco{position:absolute;right:-6px;top:-6px;opacity:.18}
.path{position:relative;padding:14px 0 18px}
.node{display:flex;align-items:center;gap:11px;margin:0 0 12px;position:relative}
.node .c{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative;transition:transform .1s}
.node .c:active{transform:scale(.95)}
.node .c.done{background:var(--reward);color:var(--ink);box-shadow:0 4px 0 #B37606}
.node .c.act{background:var(--primary);color:#fff;box-shadow:0 4px 0 #2E2591}
.node .c.act::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--primary-100);animation:pulse 1.8s infinite}
@keyframes pulse{50%{inset:-13px;opacity:.4}}
.node .c.lock{background:#E5E3DB;color:#9A9CAC;box-shadow:0 4px 0 #CFCCC2}
.node .c .ic{width:21px;height:21px}
.node .lab b{font:600 13.5px var(--fh);display:block}
.node .lab span{font-size:11.5px;color:var(--ink-2)}
.node.r{flex-direction:row-reverse;text-align:right}
.bubble{position:absolute;top:-29px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--line);color:var(--primary);font:700 10.5px var(--fh);padding:3px 8px;border-radius:8px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;letter-spacing:.06em}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-5px;width:9px;height:9px;background:#fff;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.node:has(.c.act){margin-top:28px}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px;padding:4px 18px 10px}
.prog{flex:1;height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--reward);border-radius:12px;transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.4)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:#fff;font-size:15.5px;margin-bottom:10px;transition:border-color .12s,background .12s}
.opt .k{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 13px var(--fh);color:var(--ink-3);flex:none}
.opt.on{border-color:var(--primary);background:var(--primary-50);color:#2F2793}
.opt.on .k{border-color:var(--primary);color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-50)}
.opt.wrong{border-color:var(--err);background:var(--err-50)}
.blk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--primary-100);border-bottom-width:4px;border-radius:14px;background:#fff;font:14px var(--fm);color:var(--ink);margin-bottom:8px}
.blk .num{font:600 12px var(--fh);color:#fff;background:var(--primary);width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.blk.used{opacity:.35;border-style:dashed;pointer-events:none}
.slots{border:2px dashed var(--line);border-radius:18px;padding:10px 10px 2px;min-height:120px;margin-bottom:16px;background:var(--bg-2)}
.slots .ph{font-size:13.5px;color:var(--ink-3);text-align:center;padding:30px 0}
.fb{flex:none;padding:16px 20px 30px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.fb.ok{background:var(--ok-50)}.fb.bad{background:var(--err-50)}
.fb .ft{display:flex;align-items:center;gap:10px;font:700 18px var(--fh);margin-bottom:4px}
.fb.ok .ft{color:var(--ok-ink)}.fb.bad .ft{color:var(--err)}
.fb .fi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.fb.ok .fi{background:var(--ok)}.fb.bad .fi{background:var(--err)}
.fb p{font-size:14px;color:var(--ink-2);margin-bottom:14px;line-height:1.45}
.act-area{flex:none;padding:12px 20px 30px;border-top:1px solid var(--line-2)}
.rtable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.rtable th{font:600 12px var(--fh);text-align:left;padding:9px 12px;background:var(--ink);color:#fff}
.rtable td{padding:9px 12px;border-top:1px solid var(--line-2);font-family:var(--fm);font-size:13px}
.done-hero{text-align:center;padding:20px 20px 0}
.medal{width:132px;height:132px;margin:10px auto 18px;border-radius:50%;background:var(--reward);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #B37606,0 0 0 14px var(--reward-50);animation:pin .6s cubic-bezier(.2,.9,.3,1.4)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.tile{border-radius:16px;border:2px solid;overflow:hidden;text-align:center}
.tile .tt{font:700 11px var(--fh);letter-spacing:.06em;text-transform:uppercase;padding:5px;color:#fff}
.tile .tv{font:700 20px var(--fh);padding:10px 4px;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px}

/* playground */
.pgcan{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pgcan canvas{display:block;width:100%;height:210px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:8px 2px 14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg-c{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.lg-s{width:10px;height:10px;border-radius:2px;background:var(--reward-dark)}
.lg-h{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-2)}
.lg-x{font:700 12px var(--fm);color:var(--ink);line-height:1}
.pgwrap{display:grid;grid-template-columns:18px 1fr;gap:4px}
.pgwrap .yl{writing-mode:vertical-rl;transform:rotate(180deg);font:600 11px var(--fh);color:var(--ink-2);text-align:center;display:flex;align-items:center;justify-content:space-between}
.pgwrap .yl i{font:500 10px var(--fm);font-style:normal;color:var(--ink-3)}
.xl{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--fh);color:var(--ink-2);margin:4px 0 0 22px}
.xl i{font:500 10px var(--fm);font-style:normal;color:var(--ink-3)}
.pgtip{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(23,26,43,.92);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.4;pointer-events:none}
.pgtip b{font-family:var(--fh)}
.pgcap{font-size:12px;color:var(--ink-2);background:var(--bg-2);border-radius:12px;padding:9px 11px;margin:0 0 14px;line-height:1.45}
.seg.three button{font-size:13.5px}
.pgchips{display:flex;gap:6px;min-width:0;flex-wrap:nowrap}
.pgchips .chip{padding-left:10px;padding-right:11px}
.igrid{display:grid;gap:10px}
.icard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;font:inherit;color:inherit;cursor:pointer}
.icard:active{transform:scale(.99)}
.icard.pin{border-color:var(--reward);box-shadow:0 0 0 3px var(--reward-50)}
.icard .itop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.icard b{font:600 15.5px var(--fh);display:block;line-height:1.3}
.icard p{font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ipill{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--fh);padding:3px 8px;border-radius:99px}
.ipin{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--fh);color:var(--reward-dark)}
.idate{font-size:11.5px;color:var(--ink-3)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--reward)}
.icard.sched{background:var(--bg-2);border-style:dashed}
.iact{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.iact .btn.sm{height:32px;padding:0 14px}
.pdata{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pdata .pr{display:flex;gap:12px;align-items:flex-start;padding:14px}
.pdata .pr+.pr{border-top:1px solid var(--line-2)}
.pdata .mi{width:34px;height:34px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.pdata span{font-size:12px;color:var(--ink-3);display:block}
.pdata b{font:600 15px var(--fh);display:block;margin-top:1px}
.pdata b.em{font:600 14px var(--fm);word-break:break-all}
.pdata small{font-size:12px;color:var(--ink-2)}
.kebun{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:linear-gradient(180deg,#EAF6EE,#fff 80%);border:1.5px solid #CBE7D4;border-radius:20px;padding:10px 12px 10px 8px;margin:10px 0 6px}
.kebun.wilt{background:linear-gradient(180deg,#F3F1E8,#fff 80%);border-color:#E2DECB}
.kebun .kpot{width:92px;height:92px;flex:none;border-radius:16px;background:#fff8;display:flex;align-items:flex-end;justify-content:center}
.kebun .kb{flex:1;min-width:0}
.kebun .kb .kt{font:700 17px var(--fh);display:block;margin:1px 0 2px}
.kebun .kb p{font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-bottom:8px}
.kebun>.ic{color:var(--ink-3)}
.kbar{height:6px;border-radius:6px;background:#DCEFE3;overflow:hidden;margin-bottom:5px}
.kbar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.kebun.wilt .kbar{background:#ECE8D8}.kebun.wilt .kbar i{background:#A9B48F}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kst{position:relative;background:var(--bg-2);border:1.5px solid transparent;border-radius:16px;padding:8px 6px 10px;text-align:center;opacity:.45;filter:grayscale(.8)}
.kst.got{opacity:1;filter:none;background:#EAF6EE}
.kst.cur{border-color:var(--ok)}
.kst b{display:block;font:600 12.5px var(--fh);margin-top:2px}
.kst span{font-size:11px;color:var(--ink-3)}
.kst em{position:absolute;top:6px;right:6px;font:700 9.5px var(--fh);font-style:normal;background:var(--ok);color:#fff;padding:2px 6px;border-radius:99px}
.kst em.lk{background:none;color:var(--ink-3);padding:0}
.strk{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:6px}
.strk.lit{border-color:var(--reward);background:linear-gradient(180deg,var(--reward-50),#fff 70%)}
.strk .sflame{width:52px;height:52px;border-radius:16px;background:var(--bg-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none}
.strk.lit .sflame{background:var(--reward);color:var(--ink);box-shadow:0 4px 0 #B37606}
.strk .sn{font:700 24px var(--fh);line-height:1.1}
.strk .ss{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.sweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 10px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3)}
.sd .si2{width:30px;height:30px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:#B9BBC8}
.sd.on .si2{background:var(--reward);color:var(--ink)}
.sd.today span:last-child{font-weight:700;color:var(--ink)}
.sd.today .si2{outline:2px solid var(--reward-50)}
.sfoot{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.45;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:10px}
.sfoot .ic{margin-top:1px}
.sfoot .ic{color:var(--reward-dark)}
.sfoot .link{font:600 12px var(--fh)}
.lgrid{display:grid;gap:12px}
.lcard{display:flex;gap:14px;align-items:stretch;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s}
.lcard:hover{border-color:var(--lc)}
.lcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lmono{width:76px;flex:none;border-radius:18px;background:var(--lbg);border:1.5px solid var(--lbd);display:flex;align-items:center;justify-content:center}
.lbody{flex:1;min-width:0}
.lbody b{font:700 19px var(--fh)}
.lbody .ic{color:var(--ink-3)}
.lbody p{font-size:13px;color:var(--ink-2);line-height:1.45;margin:3px 0 8px}
.lmeta{font:600 12px var(--fh);color:var(--ink-2)}
.lbar{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;margin:8px 0 5px}
.lbar i{display:block;height:100%;background:var(--lc);border-radius:6px}
.lprog{font-size:11.5px;color:var(--ink-3)}
.langbar{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.langbar .link{font:600 13px var(--fh)}
.lchip{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--fh);color:var(--ink)}
.lchip .lcl{width:28px;height:28px;border-radius:9px;border:1px solid;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ahero{display:flex;gap:14px;align-items:center;background:var(--primary);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px}
.ahero .mk{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ahero p{font-size:13.5px;opacity:.88;margin-top:2px;line-height:1.4}
.agrid{display:grid;gap:12px}
.abox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.abox .ah{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.abox .ah b{font:600 15.5px var(--fh)}
.abox .ai{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.abox .at{font-size:14px;line-height:1.6;color:var(--ink-2)}
.alist{display:grid;gap:9px}
.alist div{display:flex;gap:10px;align-items:flex-start}
.alist .n{width:22px;height:22px;border-radius:7px;background:var(--bg-2);font:700 12px var(--fh);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.alist p{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.alist p b{color:var(--ink);font-weight:700}
.amenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amenu div{background:var(--bg-2);border-radius:12px;padding:10px}
.amenu .ic{color:var(--primary)}
.amenu b{display:block;font:600 13.5px var(--fh);margin-top:4px}
.amenu span{font-size:12px;color:var(--ink-2);line-height:1.4}
.phero .em{word-break:break-all;padding:0 10px}
.pdata .em{font-family:var(--fm);font-size:13.5px;word-break:break-all}
.banner.late{background:var(--err-50);color:#9A2A20;text-align:left;margin-bottom:12px}
.lvrow .tx em.dl{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--fh);font-style:normal;margin-top:4px;padding:2px 8px;border-radius:99px}
.lvrow .tx em.dl .ic{width:12px;height:12px}
em.dl.ok{background:var(--ok-50);color:var(--ok-ink)}em.dl.err{background:var(--err-50);color:var(--err)}em.dl.rew{background:var(--reward-50);color:var(--reward-ink)}em.dl.mute{background:var(--bg-2);color:var(--ink-2)}
.nilai{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;text-align:center}
.nilai span{font-size:12px;color:var(--ink-3);display:block}
.nilai b{font:700 24px var(--fh);color:var(--primary)}
.nilai p{font-size:12.5px;color:var(--err);margin-top:4px;display:flex;gap:5px;align-items:center;justify-content:center}
.subcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score div{background:var(--bg-2);border-radius:12px;padding:8px 10px;text-align:center}
.score span{font-size:11.5px;color:var(--ink-3);display:block}
.score b{font:700 18px var(--fh)}
.score .mn b{color:var(--err)}.score .fn{background:var(--primary-50)}.score .fn b{color:var(--primary)}
.arow{display:flex;align-items:center;gap:10px;padding:11px 8px 11px 10px;border-top:1px solid var(--line-2)}
.arow:first-child{border-top:0}
.arow .ai{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font:600 14px var(--fh);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .nm span{font-size:12px;color:var(--ink-3)}
.mpts{display:grid;gap:8px;margin-bottom:14px}
.mpt{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.mpt .n{width:24px;height:24px;border-radius:8px;background:var(--primary-50);color:var(--primary);font:700 12.5px var(--fh);display:flex;align-items:center;justify-content:center;flex:none}
.mpt b{font:600 14px var(--fh);display:block}
.mpt p{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.codeb{font:500 13px/1.6 var(--fm);background:var(--ink);color:#E9E7FF;border-radius:14px;padding:12px 14px;margin:0 0 14px;white-space:pre-wrap;overflow-x:auto}
.taskcard{text-align:center;padding-top:12px}
.taskcard .ti{width:78px;height:78px;border-radius:24px;background:var(--reward-50);color:var(--reward-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.trules{display:grid;gap:8px;text-align:left}
.trules div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.trules .ic{color:var(--primary);flex:none}
.range{width:100%;appearance:none;height:8px;border-radius:8px;background:var(--line);outline:none;margin:12px 0 4px}
.range::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;background:var(--primary);border:4px solid #fff;box-shadow:0 2px 8px rgba(67,56,202,.45);cursor:grab}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--primary);border:4px solid #fff;box-shadow:0 2px 8px rgba(67,56,202,.45)}
.ticks{display:flex;justify-content:space-between;font:11px var(--fm);color:var(--ink-3)}
.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 12px}
.metric .m{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.metric .m.big{background:var(--primary);border-color:var(--primary);color:#fff}
.metric .m .v{font:700 30px var(--fh);letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.metric .m .s{font-size:12px;opacity:.8}
.mbar{height:6px;border-radius:6px;background:rgba(23,26,43,.08);margin-top:8px;overflow:hidden}
.m.big .mbar{background:rgba(255,255,255,.25)}
.mbar i{display:block;height:100%;border-radius:6px;background:var(--reward);transition:width .3s}
.insight{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;margin-bottom:16px}
.insight.ok{background:var(--ok-50);color:var(--ok-ink)}
.insight.warn{background:var(--reward-50);color:var(--reward-ink)}

/* experiments */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink-3);margin-bottom:12px}
.search:focus-within{border-color:var(--primary);color:var(--primary)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--ink);min-width:0}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sortbtn{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--fh);color:var(--ink-2);height:34px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:#fff;flex:none}
.exp{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.exp:hover{border-color:#CFCBF2;box-shadow:0 4px 14px rgba(67,56,202,.07)}
.exp .top{display:flex;align-items:flex-start;gap:12px}

.qchips button:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.stage{grid-template-columns:270px 1fr}.side.right{display:none}}
/* ---------- Pemilih perangkat ---------- */
.center{flex-direction:column;gap:12px;min-height:0;overflow:hidden}

.devmeta{font:500 11.5px var(--fm);color:var(--panel-mute)}

.dsizer{position:relative;flex:none}

function openLesson(id){

  if(fresh&&ts.k==='closed')return toast('Pengumpulan sudah ditutup','err',`Lewat ${ts.late} hari dari deadline (maksimal ${LATE_MAX} hari)`);
  const start=()=>{S.unitId=(UNITS.find(u=>u.lessons.some(l=>l.id===id))||{}).id;S.ls={id,step:0,sel:null,order:[],checked:false,right:false,correct:0,xp:0,review:st==='done',late:fresh&&ts.k==='late'?ts.late:0};go('lesson')};
  if(fresh&&ts.k==='late')return confirmDlg({title:`Tugas terlambat ${ts.late} hari`,body:`Deadline ${hariTgl(ts.due)} sudah lewat. Kamu masih bisa mengumpulkan sampai ${LATE_MAX} hari setelah deadline, tetapi nilai dikurangi ${LATE_PEN} poin per hari (−${LATE_PEN*ts.late}) dan harus dikonfirmasi admin.`,ok:'Tetap kerjakan',icon:'clock',onOk:start});
  start();
}

/* ---------- Pembahasan: materi lalu tugas ---------- */
const lessonPos=les=>{const ls=les.unit.lessons.filter(l=>l.pub);return [ls.findIndex(l=>l.id===les.id)+1,ls.length]};
SCREENS.lesson=()=>{
  const L=S.ls,steps=lessonSteps(L.id),st=steps[L.step],les=findLesson(L.id),C=lessonContent(L.id),qn=C.t.length,qi=L.step-2,[pi,pn]=lessonPos(les);

     <div class="trules"><div>${ic('clip','sm')}<span><b>${qn} soal</b> tentang materi tadi</span></div><div>${ic('check','sm')}<span>Lulus jika minimal <b>${passMin(qn)} benar</b></span></div><div>${ic('starf','sm')}<span>+10 XP per jawaban benar, bonus <b>+${les.xp} XP</b> jika lulus</span></div><div>${ic('lock','sm')}<span>Pembahasan berikutnya terbuka setelah tugas lulus</span></div></div></div>`;
    cta='Mulai tugas';
  }else if(st.type==='mc'||st.type==='result'){
    body=`<div class="eyebrow" style="color:var(--primary)">Tugas · Soal ${qi+1} dari ${qn}${st.type==='result'?' · Baca hasil':''}</div><div class="h2" style="margin:6px 0 14px;line-height:1.35">${esc(st.q)}</div>
     ${st.code?`<pre class="codeb">${esc(st.code)}</pre>`:''}
     ${st.table?`<table class="rtable"><tr>${st.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${st.table.rows.map(r=>`<tr>${r.map(c=>`<td style="${c==='?'?'color:var(--primary);font-weight:700':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:''}
     ${st.opts.map((o,i)=>{let c=L.sel===i?'on':'';if(L.checked){if(i===st.ans)c='right';else if(L.sel===i)c='wrong'}
      return `<button class="opt ${c}" ${L.checked?'disabled':''} onclick="lsSel(${i})"><span class="k">${'ABCD'[i]}</span>${esc(o)}</button>`}).join('')}`;

     <div class="slots">${L.order.length?L.order.map((b,i)=>`<button class="blk" ${L.checked?'disabled':''} onclick="lsUnplace(${i})" style="${L.checked?`border-color:${b===i?'var(--ok)':'var(--err)'}`:''}"><span class="num">${i+1}</span>${esc(st.blocks[b])}</button>`).join(''):'<div class="ph">Jawabanmu muncul di sini</div>'}</div>
     ${st.pool.map(b=>`<button class="blk ${L.order.includes(b)?'used':''}" ${L.checked?'disabled':''} onclick="lsPlace(${b})"><span class="num" style="background:var(--ink-3)">·</span>${esc(st.blocks[b])}</button>`).join('')}`;
    canCheck=L.order.length===st.blocks.length;
  }
  const info=st.type==='read'||st.type==='task';
  const foot=L.checked?`<div class="fb ${L.right?'ok':'bad'}"><div class="ft"><span class="fi">${ic(L.right?'check':'x','sm')}</span>${L.right?'Benar! +10 XP':'Belum tepat'}</div><p>${esc(st.why)}</p>
     <button class="btn ${L.right?'ok':'danger'} block" onclick="lsNext()">${L.step>=steps.length-1?'Lihat hasil tugas':L.right?'Lanjut':'Mengerti'}</button></div>`
   :`<div class="act-area"><button class="btn pri block" ${!info&&!canCheck?'disabled':''} onclick="${info?'lsNext()':'lsCheck()'}">${info?cta:'Periksa'}</button></div>`;
  return {html:`<div class="lbar"><button class="ibtn" onclick="lsExit()">${ic('x')}</button><button class="ibtn" title="Laporkan soal atau materi" aria-label="Laporkan" onclick="fbForm('lesson')" style="color:var(--ink-3)">${ic('flag')}</button><div class="prog"><i style="width:${Math.max(4,pct)}%"></i></div><span class="stat" style="border:0;padding:0;color:var(--primary)">${ic('starf','sm')}${L.xp}</span></div>
   <div class="scroll"><div class="pad">${body}</div></div>${foot}`};

function lsSel(i){if(S.ls.checked)return;S.ls.sel=i;render()}
function lsPlace(b){const L=S.ls;if(!L.order.includes(b)){L.order.push(b);render()}}
function lsUnplace(i){S.ls.order.splice(i,1);render()}
function lsCheck(){const L=S.ls,st=lessonSteps(L.id)[L.step];
  L.right=st.type==='order'?L.order.every((b,i)=>b===i):L.sel===st.ans;
  L.checked=true;if(L.right){L.correct++;L.xp+=10}render()}
function lsNext(){const L=S.ls;if(L.step>=lessonSteps(L.id).length-1){finishLesson();return}
  L.step++;L.sel=null;L.order=[];L.checked=false;render()}
function lsRetry(step){Object.assign(S.ls,{step,sel:null,order:[],checked:false,right:false,correct:0,xp:0});go('lesson')}
function lsExit(){confirmDlg({title:'Keluar dari pembahasan?',body:'Jawaban tugas yang sudah dikerjakan akan hilang dan XP tidak tercatat.',ok:'Keluar',cancel:'Lanjut belajar',danger:true,onOk:()=>go(S.unitId?'unit':'home')})}
function finishLesson(){const L=S.ls,u=me(),les=findLesson(L.id);
  L.pass=L.correct>=passMin(lessonContent(L.id).t.length);recordAttempt(L.id,L.pass);
  L.bonus=L.pass&&!L.review?les.xp:0;const gain=L.xp+L.bonus;
  u.xp+=gain;u.xpToday+=gain;{const lg=LANG_OF(L.id);if(lg){u.xpBy=u.xpBy||{};u.xpBy[lg]=(u.xpBy[lg]||0)+gain}}
  if(L.pass&&u.lastDay!==TODAY){u.streak++;u.lastDay=TODAY}
  if(L.pass&&!L.review){myDone().add(L.id);const m=MEMBERS.find(m=>m.email===u.email);if(m)m.lessons++}
  const qn=lessonContent(L.id).t.length;L.score=Math.round(L.correct/qn*100);L.final=Math.max(0,L.score-LATE_PEN*(L.late||0));
  if(L.pass&&!L.review&&dueOf(L.id))SUBS.push({id:nextSubId++,email:u.email,lesson:L.id,correct:L.correct,qn,submitted:TODAY,late:L.late||0,status:L.late?'pending':'ontime'});
  L.gain=gain;go('lessonDone')}
SCREENS.lessonDone=()=>{const L=S.ls,u=me(),les=findLesson(L.id),qn=lessonContent(L.id).t.length;
  const back=`<button class="btn ${L.pass?'pri':'sec'} block" onclick="go(S.unitId?'unit':'home')">Kembali ke daftar pembahasan</button>`;

      <div class="tile" style="border-color:var(--primary)"><div class="tt" style="background:var(--primary)">Streak</div><div class="tv" style="color:var(--primary)">${ic('zapf','sm')}${u.streak}</div></div>
    </div>
    ${L.pass&&!L.review?`<div class="nilai"><span>Nilai tugas</span><b>${L.late?`${L.score} − ${LATE_PEN*L.late} = ${L.final}`:L.score}</b>${L.late?`<p>${ic('clock','sm')} Terlambat ${L.late} hari. Nilai berlaku setelah dikonfirmasi admin.</p>`:''}</div>`:''}

  </div></div><div class="act-area" style="border:0;display:grid;gap:8px">${L.pass?back:`<button class="btn pri block" onclick="lsRetry(2)">${ic('refresh','sm')} Ulangi tugas</button><button class="btn sec block" onclick="lsRetry(0)">Baca materi lagi</button>`}</div>`,

const COURSES=['Dasar Pemrograman','Praktikum Dasar Pemrograman'];
const NOW_T='09:41';                       /* jam di prototipe (sama dengan status bar) */
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const dObj=d=>new Date(d+'T00:00:00');
const addDays=(d,n)=>{const x=dObj(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((dObj(a)-dObj(b))/864e5);
const hariTgl=d=>`${HARI[dObj(d).getDay()]}, ${fmtDate(d)}`;
const minus30=t=>{let [h,m]=t.split(':').map(Number);m-=30;if(m<0){m+=60;h--}return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`};
const jam=t=>t.replace(':','.');
let INFO=[];   /* dikosongkan dulu */
let nextInfoId=1;
/* waktu pengingat dikirim: deadline → H-1 pukul 08.00; kelas → 30 menit sebelum mulai */
const sendAt=i=>i.type==='deadline'?{d:addDays(i.due,-1),t:'08:00'}:{d:i.date,t:minus30(i.start)};
const isSent=i=>{const s=sendAt(i);return s.d<TODAY||(s.d===TODAY&&s.t<=NOW_T)};
const infoCourse=i=>i.type==='deadline'?(findLesson(i.lesson)||{unit:{title:'-'}}).unit.title:i.course;
const infoTitle=i=>i.type==='deadline'?`Deadline tugas: ${(findLesson(i.lesson)||{title:'Pembahasan'}).title}`:`Kelas ${i.course} dimulai 30 menit lagi`;
const sentLabel=i=>{const s=sendAt(i),dd=dayDiff(s.d,TODAY);return `${dd===0?'Hari ini':dd===-1?'Kemarin':dd===1?'Besok':fmtDate(s.d)} ${jam(s.t)}`};
const dueBadge=i=>{const n=dayDiff(i.due,TODAY);return n<0?['Sudah lewat','err']:n===0?['Hari ini','err']:n===1?['Besok','rew']:[`${n} hari lagi`,'mute']};
const infoSort=(a,b)=>{const A=sendAt(a),B=sendAt(b);return (B.d+B.t).localeCompare(A.d+A.t)};
const TYP={deadline:['clock','Deadline tugas','var(--err-50)','var(--err)'],kelas:['bell','Pengingat kelas','var(--primary-50)','var(--primary)']};
const typPill=t=>`<span class="ipill" style="background:${TYP[t][2]};color:${TYP[t][3]}">${ic(TYP[t][0],'sm')}${TYP[t][1]}</span>`;
function infoCard(i){const sent=isSent(i);

    meta=`${esc(infoCourse(i))} · Batas ${hariTgl(i.due)} pukul 23.59`;
    extra=`<div class="iact"><span class="pill ${tc}">${tl}</span><span class="sp"></span>${canSubmit(ts)?`<button class="btn ${ts.k==='late'?'danger-o':'pri'} sm" onclick="event.stopPropagation();infoDo(${i.lesson})">${ts.k==='late'?`Kerjakan (−${LATE_PEN*ts.late})`:'Kerjakan'}</button>`:''}</div>`}
  else meta=`${hariTgl(i.date)} · Mulai ${jam(i.start)} · ${esc(i.room)}`;
  return `<div class="icard ${sent?'':'sched'}" role="button" tabindex="0" onclick="infoOpen(${i.id})">
    <div class="itop">${typPill(i.type)}<span class="sp"></span>${sent&&!S.read.has(i.id)?'<span class="udot" title="Belum dibaca"></span>':''}<span class="idate">${sent?'':'Terjadwal · '}${sentLabel(i)}</span></div>
    <b>${esc(infoTitle(i))}</b><p>${meta}</p>${extra}</div>`}
function infoDo(id){if(lessonStatus(id)==='lock')return toast('Pembahasan masih terkunci','info','Selesaikan tugas pembahasan sebelumnya dulu');openLesson(id)}
function infoOpen(id){const i=INFO.find(x=>x.id===id);if(isSent(i))S.read.add(id);
  let rows,msg,btn='';
  if(i.type==='deadline'){const l=findLesson(i.lesson),done=myDone().has(i.lesson);
    const ts=taskState(i.lesson);
    msg=ts.k==='late'?`Deadline sudah lewat ${ts.late} hari. Kamu masih bisa mengumpulkan sampai ${LATE_MAX} hari setelah deadline, tetapi nilai dikurangi ${LATE_PEN} poin per hari dan harus dikonfirmasi admin.`
      :ts.k==='closed'?`Pengumpulan sudah ditutup karena lewat lebih dari ${LATE_MAX} hari dari deadline.`
      :ts.k==='pending'?'Tugasmu sudah dikumpulkan setelah deadline dan sedang menunggu konfirmasi admin.'
      :done?'Tugas ini sudah kamu kerjakan. Tidak perlu mengumpulkan lagi.':'Baca materinya lalu kerjakan tugas sebelum batas waktu.';
    rows=[['Mata kuliah',esc(infoCourse(i))],['Pembahasan',esc(l?l.title:'-')],['Batas pengumpulan',`${hariTgl(i.due)}, 23.59`],['Status',(taskLabel(ts)||['-'])[0]],['Jika terlambat',`−${LATE_PEN} poin/hari, maks. ${LATE_MAX} hari, konfirmasi admin`]];
    if(canSubmit(ts))btn=`<button class="btn pri block" style="margin-bottom:8px" onclick="closeOv();infoDo(${i.lesson})">${ts.k==='late'?`Kerjakan tugas (nilai −${LATE_PEN*ts.late})`:'Kerjakan tugas sekarang'}</button>`}
  else{msg=`Kelas ${esc(i.course)} akan dimulai pukul ${jam(i.start)}. Siapkan diri dan datang tepat waktu.`;
    rows=[['Mata kuliah',esc(i.course)],['Hari, tanggal',hariTgl(i.date)],['Jam mulai',jam(i.start)],['Ruang',esc(i.room)]]}

/* ---------- Keterlambatan pengumpulan tugas ----------
   Aturan: setelah deadline masih boleh mengumpulkan maksimal 3 hari,
   nilai dikurangi 5 poin per hari terlambat, dan wajib dikonfirmasi admin. */
const LATE_PEN=5,LATE_MAX=3;
const NIM_Y='zidney953@gmail.com';
let SUBS=[];
let nextSubId=1;
const dueOf=id=>INFO.filter(i=>i.type==='deadline'&&i.lesson===id).map(i=>i.due).sort().pop()||null;
const lateDays=id=>{const d=dueOf(id);return d?Math.max(0,dayDiff(TODAY,d)):0};
const subOf=(email,id)=>SUBS.filter(s=>s.email===email&&s.lesson===id).pop();
const rawScore=s=>Math.round(s.correct/s.qn*100);
const finalScore=s=>s.status==='rejected'?0:Math.max(0,rawScore(s)-LATE_PEN*s.late);
/* status tugas untuk user yang sedang masuk */
function taskState(id){const sub=subOf(me().email,id),due=dueOf(id);
  if(sub)return {k:sub.status,sub,late:sub.late,due};
  if(myDone().has(id))return {k:'done',due};
  if(!due)return {k:'none'};
  const late=lateDays(id);
  if(late===0)return {k:'open',due,left:dayDiff(due,TODAY)};
  if(late<=LATE_MAX)return {k:'late',due,late};
  return {k:'closed',due,late}}
function taskLabel(t){switch(t.k){
  case 'open':return [t.left===0?'Deadline hari ini':t.left===1?'Deadline besok':`Deadline ${fmtDate(t.due)}`,t.left<=1?'rew':'mute'];
  case 'late':return [`Terlambat ${t.late} hari · nilai −${LATE_PEN*t.late}`,'err'];
  case 'closed':return ['Pengumpulan ditutup','err'];
  case 'pending':return ['Menunggu konfirmasi admin','rew'];
  case 'approved':return [`Diterima admin · nilai ${finalScore(t.sub)}`,'ok'];
  case 'rejected':return ['Ditolak admin · nilai 0','err'];
  case 'ontime':return [`Tepat waktu · nilai ${finalScore(t.sub)}`,'ok'];
  case 'done':return t.due?['Sudah dikerjakan','ok']:null;
  default:return null}}
const canSubmit=t=>t.k==='open'||t.k==='late';

const KEBUN=[[0,'Bibit','Baru ditanam. Mulai belajar untuk menumbuhkannya.'],[1,'Tunas','Tunas pertama muncul.'],[3,'Tanaman kecil','Daunnya mulai bertambah.'],[7,'Tanaman rimbun','Seminggu belajar, daunnya lebat.'],[14,'Pohon muda','Batangnya mulai kokoh.'],[30,'Pohon berbuah','Sebulan konsisten, pohonmu berbuah!']];
const kebunStage=st=>{let i=0;KEBUN.forEach((k,j)=>{if(st>=k[0])i=j});return i};
function plantSVG(stage,wilt=false,z=96){
  const g=wilt?'#A9B48F':'#3FA66B',g2=wilt?'#93A07A':'#2E8A55',trunk='#8B5E3C';
  const leaf=(x,y,dir,s=1)=>`<ellipse cx="${x+dir*8*s}" cy="${y-2*s}" rx="${9*s}" ry="${4.3*s}" fill="${dir<0?g:g2}" transform="rotate(${dir*-28+(wilt?dir*22:0)} ${x+dir*8*s} ${y-2*s})"/>`;
  let p='';
  if(stage===0)p=`<ellipse cx="60" cy="84" rx="6" ry="4" fill="#8B5E3C"/><path d="M60 80c0-4 3-6 5-6" stroke="${g}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  else if(stage<=3){const top=[0,72,60,46][stage];
    p=`<path d="M60 88 C60 ${top+12} ${wilt?66:60} ${top+6} ${wilt?64:60} ${top}" stroke="${g2}" stroke-width="${stage===3?4:3}" fill="none" stroke-linecap="round"/>`;
    const n=[0,1,2,3][stage];for(let i=0;i<n;i++){const y=84-i*((88-top)/n)-4;p+=leaf(60,y,-1,.7+i*.12)+leaf(60,y-4,1,.7+i*.12)}
    p+=leaf(wilt?64:60,top+2,-1,.55)+leaf(wilt?64:60,top,1,.55)}
  else{p=`<path d="M60 88V54M60 70l-9-8M60 64l8-7" stroke="${trunk}" stroke-width="${stage===5?7:6}" fill="none" stroke-linecap="round"/>`+
    `<g fill="${g}"><circle cx="60" cy="38" r="${stage===5?24:21}"/><circle cx="41" cy="50" r="${stage===5?15:13}"/><circle cx="79" cy="48" r="${stage===5?16:14}"/></g><g fill="${g2}" opacity=".55"><circle cx="70" cy="32" r="9"/><circle cx="48" cy="44" r="7"/></g>`;
    if(stage===5)p+=`<g fill="${wilt?'#C9A35A':'#F2A20C'}" stroke="#B37606" stroke-width="1"><circle cx="48" cy="38" r="4.5"/><circle cx="70" cy="46" r="4.5"/><circle cx="60" cy="26" r="4.5"/><circle cx="82" cy="38" r="4"/><circle cx="40" cy="54" r="4"/></g>`}
  return `<svg width="${z}" height="${z}" viewBox="0 0 120 120" aria-label="${KEBUN[stage][1]}">${p}
    <rect x="26" y="86" width="68" height="10" rx="3" fill="#B5653A"/><path d="M31 96h58l-6 20H37z" fill="#C97B4A"/><ellipse cx="60" cy="87" rx="30" ry="3.5" fill="#6B4A2E"/></svg>`}
function kebunCard(u){const st=u.streak||0,lit=u.lastDay===TODAY,i=kebunStage(st),wilt=st>0&&!lit,nx=KEBUN[i+1];
  const from=KEBUN[i][0],pct=nx?Math.min(100,(st-from)/(nx[0]-from)*100):100;
  return `<button class="kebun ${wilt?'wilt':''}" onclick="kebunSheet()">
    <div class="kpot">${plantSVG(i,wilt,92)}</div>
    <div class="kb"><div class="xs" style="color:var(--ok-ink);font-weight:700;letter-spacing:.04em">KEBUN SINAU</div>
      <b class="kt">${KEBUN[i][1]}</b>
      <p>${wilt?'Tanamanmu mulai layu. Selesaikan 1 pembahasan hari ini untuk menyiramnya.':st?'Tanamanmu segar hari ini. Terus belajar agar tumbuh lebih besar.':KEBUN[0][2]}</p>
      <div class="kbar"><i style="width:${pct}%"></i></div>
      <div class="xs muted">${nx?`${nx[0]-st} hari lagi menjadi <b>${nx[1]}</b>`:'Tahap tertinggi tercapai!'}</div></div>
    ${ic('chev','sm')}</button>`}
function kebunSheet(){const u=me(),st=u.streak||0,cur=kebunStage(st);

   <div class="kgrid">${KEBUN.map(([d,n,desc],j)=>`<div class="kst ${j<=cur?'got':''} ${j===cur?'cur':''}">${plantSVG(j,false,64)}<b>${n}</b><span>${d===0?'Awal':d+' hari streak'}</span>${j===cur?'<em>Sekarang</em>':j>cur?`<em class="lk">${ic('lock','sm')}</em>`:''}</div>`).join('')}</div>

function ppPick(cam){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(cam)inp.setAttribute('capture','user');
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    if(!/^image\//.test(f.type))return toast('File harus berupa gambar','err','Pilih foto JPG atau PNG');
    if(f.size>10*1024*1024)return toast('Foto terlalu besar','err','Maksimal 10 MB');
    const r=new FileReader();r.onload=()=>ppCrop(r.result);r.onerror=()=>toast('Foto gagal dibaca','err','Coba pilih foto lain');r.readAsDataURL(f)};

let CAM=null;
function camStop(){if(CAM&&CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());CAM=null}
function ppCamera(){closeOv();
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return ppPick(true);
  CAM={facing:'user',stream:null};
  $('#ov').insertAdjacentHTML('beforeend',`<div class="camv"><div class="ctop"><button onclick="closeOv()" aria-label="Tutup kamera">${ic('x')}</button><b style="font-family:var(--fh)">Ambil foto</b><span style="width:40px"></span></div>
   <div class="cview"><video id="camVid" class="mir" autoplay playsinline muted></video><div class="cring"></div><div class="cmsg" id="camMsg"><span class="spin" style="border-color:#2B2F48;border-top-color:#fff"></span>Membuka kamera…</div></div>
   <div class="cbot"><button class="cside" onclick="closeOv();ppPick(false)" aria-label="Pilih dari galeri">${ic('image')}</button><button class="shut" id="camShut" onclick="camShot()" aria-label="Ambil foto" disabled></button><button class="cside" onclick="camFlip()" aria-label="Ganti kamera depan/belakang">${ic('flip')}</button></div></div>`);
  camOpen()}
function camOpen(){const c=CAM;if(!c)return;if(c.stream)c.stream.getTracks().forEach(t=>t.stop());
  navigator.mediaDevices.getUserMedia({video:{facingMode:c.facing,width:{ideal:1080},height:{ideal:1080}},audio:false}).then(st=>{
    if(CAM!==c){st.getTracks().forEach(t=>t.stop());return}
    c.stream=st;const v=$('#camVid');v.srcObject=st;v.classList.toggle('mir',c.facing==='user');$('#camMsg').hidden=true;$('#camShut').disabled=false
  }).catch(err=>{if(CAM!==c)return;const m=$('#camMsg');m.hidden=false;const r=document.querySelector('.camv .cring');if(r)r.hidden=true;
    m.innerHTML=`${ic('camera','xl')}<b style="color:#fff;font-size:16px">Kamera tidak bisa dibuka</b><span>${err&&err.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan akses kamera di pengaturan, atau pilih foto dari galeri.':'Kamera tidak tersedia di perangkat ini. Pilih foto dari galeri saja.'}</span><button class="btn pri sm" style="margin-top:6px" onclick="closeOv();ppPick(false)">${ic('image','sm')} Pilih dari galeri</button>`})}
function camFlip(){if(!CAM)return;CAM.facing=CAM.facing==='user'?'environment':'user';$('#camShut').disabled=true;camOpen()}
function camShot(){const v=$('#camVid');if(!v||!v.videoWidth)return;const s=Math.min(v.videoWidth,v.videoHeight),cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  if(CAM.facing==='user'){x.translate(s,0);x.scale(-1,1)}
  x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,s,s);ppCrop(cv.toDataURL('image/jpeg',.9))}
/* Atur posisi & zoom sebelum disimpan (potong lingkaran) */
let CROP=null;
function ppCrop(src){const img=new Image();img.onload=()=>{
  CROP={img,z:1,x:0,y:0,base:260/Math.min(img.naturalWidth,img.naturalHeight)};
  sheet(`<div class="h2" style="margin-bottom:4px">Atur foto</div><p class="small muted" style="margin-bottom:14px">Geser foto untuk mengatur posisi, perbesar dengan slider.</p>

function cropDraw(){const c=CROP;if(!c)return;const sc=c.base*c.z,w=c.img.naturalWidth*sc,h=c.img.naturalHeight*sc,mx=(w-260)/2,my=(h-260)/2;

function lfSync(){const F=S._lf;if(!F)return;const g=i=>document.getElementById(i);
  if(g('lTitle'))F.title=g('lTitle').value;if(g('lText'))F.text=g('lText').value;if(g('lCode'))F.code=g('lCode').value;if(g('lVideo'))F.video=g('lVideo').value.trim();if(g('lXp'))F.xp=g('lXp').value;

    if(el.dataset.o!=null)q.opts[+el.dataset.o]=el.value;else if(el.dataset.k==='blocks')q.blocks=el.value.split('\n');else q[el.dataset.k]=el.value})}
const parseTbl=t=>{const ls=(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.split('|').map(c=>c.trim()));return ls.length?{head:ls[0],rows:ls.slice(1)}:null};
const tblPrev=t=>{const T=parseTbl(t);return T&&T.rows.length?`<table class="rtable" style="margin-bottom:10px"><tr>${T.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${T.rows.map(r=>`<tr>${r.map(c=>`<td style="${c==='?'?'color:var(--primary);font-weight:700':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:''};

  else{const okv=ytId(F.video)||F.vfile;ok=fieldErr('lVideo',!okv?(F.video?'Link YouTube tidak dikenali':'Isi link video atau upload video'):'')&&ok}
  F.qs.forEach((q,i)=>{ok=fieldErr('q'+i,!q.q.trim()?'Pertanyaan wajib diisi':'')&&ok;
    const e=document.getElementById('qoe'+i);let m='';
    if(q.type==='result'){const T=parseTbl(q.tableText);if(!T||T.rows.length<1||T.head.length<2)m='Isi tabel minimal 2 kolom dan 1 baris data'}
    if(!m&&q.type!=='order'){const filled=q.opts.filter(o=>o.trim());if(filled.length<2)m='Isi minimal 2 pilihan jawaban';else if(!q.opts[q.ans]||!q.opts[q.ans].trim())m='Jawaban benar belum diisi'}
    else{const b=(q.blocks||[]).map(x=>x.replace(/\s+$/,'')).filter(x=>x.trim());if(b.length<2)m='Isi minimal 2 blok kode'}
    if(e)e.innerHTML=m?`${ic('info','sm')} ${m}`:'';if(m)ok=false});
  ok=fieldErr('lXp',!/^\d+$/.test(xp)||+xp<5||+xp>50?'Isi angka 5–50':'')&&ok;
  if(!ok){toast('Periksa kembali isian','err','Ada kolom yang belum lengkap');const b=document.querySelector('.fld.bad, .ferr:not(:empty)');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});return}

        const r={...q,opts:keep.map(x=>x.o),ans,why:q.why.trim()||'Jawaban yang benar sudah ditandai oleh admin.'};if(r.code!=null&&!r.code.trim())delete r.code;

  if(r==='lessonForm')return go(r);

/* ======================= Perangkat & layar penuh ======================= */
/* Ukuran logis (pt/dp). Spesifikasi resmi iPhone 18 belum dipastikan: dipakai ukuran iPhone 17 (6,3") 402 × 874. */
const DEV={phone:{w:402,h:874,name:'HP',sub:'iPhone 18 · 402×874',ic:'phone'},tablet:{w:820,h:1180,name:'Tablet',sub:'iPad · 820×1180',ic:'tablet'},laptop:{w:1440,h:900,name:'Laptop',sub:'Web · 1440×900',ic:'laptop'}};
S.dev='phone';S.fullManual=false;
function renderDevbar(){const d=DEV[S.dev];
  $('#devbar').innerHTML=`<div class="devseg">${Object.entries(DEV).map(([k,v])=>`<button class="${S.dev===k?'on':''}" onclick="setDev('${k}')">${ic(v.ic,'sm')}${v.name}</button>`).join('')}</div>
   <span class="devmeta">${d.sub} · <span id="devScale"></span></span>
   <button class="devfull" onclick="setFull(true)" title="Tampilkan aplikasi memenuhi jendela browser">${ic('expand','sm')}Layar penuh</button>`}
function fitDevice(){const ph=$('.phone'),sz=$('#dsizer');
  if(document.body.classList.contains('full')){ph.style.cssText='';sz.style.cssText='';return}
  const d=DEV[S.dev],c=$('.center'),bar=$('#devbar'),sc=$('#devScale');
  const calc=()=>Math.min(1,(c.clientWidth-8)/d.w,(c.clientHeight-bar.offsetHeight-16)/d.h);
  let s=calc();if(sc){sc.textContent='skala '+Math.round(s*100)+'%';s=calc();sc.textContent='skala '+Math.round(s*100)+'%'}
  ph.style.width=d.w+'px';ph.style.height=d.h+'px';ph.style.transform=`scale(${s})`;
  sz.style.width=d.w*s+'px';sz.style.height=d.h*s+'px'}
function setDev(k){S.dev=k;$('.phone').className='phone dev-'+k;document.body.classList.toggle('wide-dev',k!=='phone');renderDevbar();fitDevice();render()}
function autoFull(){return matchMedia('(max-width:820px)').matches||matchMedia('(pointer:coarse)').matches||new URLSearchParams(location.search).has('full')}
function applyFull(){const full=S.fullManual||autoFull();const was=document.body.classList.contains('full');
  document.body.classList.toggle('full',full);document.body.classList.toggle('manual',S.fullManual&&!autoFull());
  $('.phone').className='phone dev-'+(full?'phone':S.dev);document.body.classList.toggle('wide-dev',!full&&S.dev!=='phone');
  fitDevice();if(was!==full)render()}
function setFull(on){S.fullManual=on;applyFull()}
addEventListener('resize',()=>{applyFull();fitDevice()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.fullManual)setFull(false)});

renderDevbar();applyFull();
render();
setTimeout(()=>{if(S.route==='splash')go('login')},1600);
</script>
